name: Database backup

on:
  schedule:
    # Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mongodump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MongoDB Database Tools
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          . /etc/os-release
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu ${VERSION_CODENAME}/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools

      - name: Dump the url_shortener database
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "MONGODB_URI secret is not configured." >&2
            exit 1
          fi
          mkdir -p backup
          mongodump \
            --uri "$MONGODB_URI" \
            --db url_shortener \
            --archive="backup/lynky-$(date -u +%F).archive.gz" \
            --gzip

      - name: Upload the backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: lynky-backup-${{ github.run_id }}
          path: backup/*.archive.gz
          retention-days: 90
