name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
concurrency:
  group: opencode-${{ github.event.comment.id }}
  cancel-in-progress: false
jobs:
  opencode:
    # Only trusted users may invoke the agent. Without this check, anyone on a
    # public repository could comment `/oc` and run it with write permissions
    # and repository secrets.
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        # Pinned to the v2.2.5 commit instead of a mutable `latest` tag.
        uses: anomalyco/opencode/github@9bbb8ce18c80f099e0e448775f59d965ead40a21
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/gpt-5.5
