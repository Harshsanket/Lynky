<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Lynky — Clean & Shorten URLs</title>

    <meta
      name="description"
      content="Lynky is an open-source URL shortener that cleans known tracking parameters and turns long links into simple, shareable URLs."
    />

    <meta name="author" content="Harsh Sanket" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <link
      rel="canonical"
      href="https://lynky-hs.vercel.app/"
    />

    <!-- Browser -->
    <meta
      name="theme-color"
      content="#F4F0E8"
    />

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <!-- Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/lynky-icon.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="/lynky-icon.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <meta
      property="og:site_name"
      content="Lynky"
    />

    <meta
      property="og:title"
      content="Lynky — Clean & Shorten URLs"
    />

    <meta
      property="og:description"
      content="Remove known tracking parameters and turn long URLs into simple, shareable links."
    />

    <meta
      property="og:url"
      content="https://lynky-hs.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://lynky-hs.vercel.app/lynky-icon.png"
    />

    <meta
      property="og:image:width"
      content="512"
    />

    <meta
      property="og:image:height"
      content="512"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:alt"
      content="Lynky"
    />

    <!-- X / Twitter -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Lynky — Clean & Shorten URLs"
    />

    <meta
      name="twitter:description"
      content="Remove known tracking parameters and turn long URLs into simple, shareable links."
    />

    <meta
      name="twitter:image"
      content="https://lynky-hs.vercel.app/lynky-icon.png"
    />

    <meta
      name="twitter:image:alt"
      content="Lynky"
    />

    <meta
      name="twitter:creator"
      content="@harshsanket1"
    />

    <!-- Web App -->
    <meta
      name="application-name"
      content="Lynky"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Lynky"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Lynky",
        "url": "https://lynky-hs.vercel.app/",
        "description": "Lynky is an open-source URL shortener that cleans known tracking parameters and turns long links into simple, shareable URLs.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "image": "https://lynky-hs.vercel.app/lynky-icon.png",
        "author": {
          "@type": "Person",
          "name": "Harsh Sanket"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
